<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal - PharmaCare</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="background: radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.08) 0%, transparent 60%);">

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="container navbar">
            <a href="index.html" class="brand">
                <div class="brand-icon">P</div>
                <div class="brand-text">
                    <h1>PharmaCare</h1>
                    <p>Next-Gen Pharmacy System</p>
                </div>
            </a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; margin-right:4px;"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Back to Storefront
                </a>
            </div>
        </div>
    </header>

    <!-- Login Portal -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-icon" style="margin: 0 auto 1.25rem; width:52px; height:52px; font-size:1.6rem;">P</div>
                <h2>Staff Sign In</h2>
                <p>Access the Pharmacy POS &amp; Inventory Dashboard</p>
            </div>

            <!-- Error message container -->
            <div id="errorBox" class="toast error" style="position:static; margin-bottom:1.5rem; width:100%; justify-content:center; display:none;">
                <span id="errorMessage">Invalid username or password.</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="e.g. admin" required autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="padding:0.85rem; font-size:0.95rem; margin-top:0.5rem;">
                    Sign In to Console
                </button>
            </form>

            <div style="margin-top:1.75rem; padding-top:1.25rem; border-top:1px solid var(--border); text-align:center; font-size:0.8125rem; color:var(--text-muted);">
                <p>Default Login: <strong style="color:var(--text-main);">admin</strong> / <strong style="color:var(--text-main);">admin123</strong></p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2026 PharmaCare System. Static Frontend + Local PHP API.</p>
        </div>
    </footer>

    <!-- Login Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkActiveSession();

            const form = document.getElementById('loginForm');
            form.addEventListener('submit', handleLogin);
        });

        // Redirect immediately if user is already logged in
        async function checkActiveSession() {
            try {
                const res = await fetch('api/auth.php?action=check');
                const result = await res.json();
                if (result.success) {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Handle AJAX form submission
        async function handleLogin(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const errorMessage = document.getElementById('errorMessage');

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) return;

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Verifying...';
                errorBox.style.display = 'none';

                const res = await fetch('api/auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await res.json();
                if (result.success) {
                    window.location.href = 'dashboard.html';
                } else {
                    errorMessage.textContent = result.message || 'Invalid username or password.';
                    errorBox.style.display = 'flex';
                }
            } catch (err) {
                console.error(err);
                errorMessage.textContent = 'Connection error. Check XAMPP services.';
                errorBox.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In to Console';
            }
        }
    </script>
</body>
</html>
