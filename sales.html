<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales History - PharmaCare</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navbar -->
    <header class="app-header">
        <div class="container navbar">
            <nav class="top-nav-links">
                <a href="dashboard.html" class="nav-item">Dashboard Overview</a>
                <a href="medicines.html" class="nav-item">Medicine Management</a>
                <a href="pos.html" class="nav-item">Billing</a>
                <a href="sales.html" class="nav-item active">Sales History</a>
            </nav>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-secondary btn-sm" target="_blank">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle; margin-right:4px;"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                    Storefront
                </a>
                <a href="#" onclick="handleLogout(event)" class="btn btn-danger btn-sm">Logout</a>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container dashboard-container">

        <!-- SALES HISTORY TABLE PANEL -->
        <div class="panel" style="margin-bottom: 0;">
            <div class="panel-header">
                <h3>Sales History &amp; Orders</h3>
                <button class="btn btn-secondary btn-sm" onclick="loadSalesHistory()">Refresh</button>
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Invoice #</th>
                            <th>Date &amp; Time</th>
                            <th>Customer Name</th>
                            <th>Customer Phone</th>
                            <th>Total Amount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="salesHistoryTableBody">
                        <tr><td colspan="6" class="text-center">Loading sales history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Sale Details Modal -->
    <div id="saleDetailsModal" class="modal-overlay">
        <div class="modal-card" style="max-width: 580px;">
            <div class="modal-header">
                <h3 id="modalInvoiceTitle">Invoice Details</h3>
                <button type="button" class="btn btn-sm btn-secondary" onclick="closeModal('saleDetailsModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modalCustomerInfo" style="margin-bottom: 1.25rem; font-size: 0.9rem; background: var(--surface-alt); padding: 0.85rem; border-radius: var(--radius-sm); border: 1px solid var(--border);"></div>
                <div class="table-responsive">
                    <table class="table" style="font-size: 0.88rem;">
                        <thead>
                            <tr>
                                <th>Medicine</th>
                                <th>Qty</th>
                                <th>Price</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="modalItemsBody"></tbody>
                    </table>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 1.25rem; font-size: 1.15rem; font-weight:700;">
                    <span>Grand Total:</span>
                    <span id="modalGrandTotal" class="price-tag" style="font-size:1.35rem;">₹0.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
